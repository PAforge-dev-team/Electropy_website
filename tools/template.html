<!DOCTYPE html>
<html lang="{{HTML_LANG}}" dir="{{DIR}}" data-lang="{{LANG}}">
<head>
{{HEAD}}
</head>
<body>

<!-- ========== LOADING SCREEN ========== -->
<div class="loader" id="loader">
  <div class="loader-resistor">
    <svg viewBox="0 0 120 60">
      <rect class="ldr-body" x="10" y="20" width="100" height="30" rx="14" fill="none" stroke="#91b9c2" stroke-width="2"/>
      <rect class="ldr-band" x="30" y="20" width="6" height="30" fill="#8a5a2b"/>
      <rect class="ldr-band" x="46" y="20" width="6" height="30" fill="#1c1c1c"/>
      <rect class="ldr-band" x="62" y="20" width="6" height="30" fill="#c0392b"/>
      <rect class="ldr-band" x="78" y="20" width="6" height="30" fill="#d4ac0d"/>
      <rect class="ldr-glow" x="6" y="16" width="108" height="38" rx="18"/>
    </svg>
  </div>
  <div class="loader-bar"></div>
  <div class="loader-text" data-text="loader_text">{{t:loader_text}}</div>
</div>

<!-- ========== STICKY HEADER ========== -->
<header class="sticky-header" id="stickyHeader">
  <div class="sticky-inner">
    <button class="sticky-brand" id="brandBtn" aria-label="{{t:aria_back_to_top}}" data-aria="aria_back_to_top">
      <div class="sticky-brand-icon">
        <svg viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="42" height="42" rx="5" fill="#0b1b2a"/>
          <path d="M11 25h20M11 19h14M11 13h8" stroke="#9fc5d0" stroke-width="3" stroke-linecap="square" fill="none"/>
        </svg>
      </div>
      <span data-text="brand">{{t:brand}}</span>
    </button>
    <nav class="sticky-nav">
      <button data-nav="home" data-text="nav_home">{{t:nav_home}}</button>
      <button data-nav="features" data-text="nav_features">{{t:nav_features}}</button>
      <button data-nav="about" data-text="nav_about">{{t:nav_about}}</button>
      <button data-nav="download" data-text="nav_download">{{t:nav_download}}</button>
      <button data-nav="faq" data-text="nav_faq">{{t:nav_faq}}</button>
    </nav>
    <div class="sticky-actions">
      <nav class="lang-switch" aria-label="{{t:aria_language}}" data-aria="aria_language">{{LANG_HTML}}</nav>
      <button class="sticky-tg-icon" id="headerTelegramBtn" aria-label="{{t:aria_telegram}}" data-aria="aria_telegram" title="{{t:title_telegram}}" data-title="title_telegram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21.94 4.6 18.6 20.3c-.25 1.12-.91 1.4-1.85.87l-5.1-3.76-2.46 2.37c-.27.27-.5.5-1.02.5l.36-5.2 9.45-8.54c.41-.36-.09-.57-.64-.2L5.66 13.1.62 11.5c-1.1-.34-1.11-1.1.23-1.63L20.54 2.4c.91-.33 1.71.21 1.4 2.2z"/>
        </svg>
      </button>
      <button class="sticky-cta" id="headerGithubBtn" aria-label="{{t:nav_visit_github}}" data-aria="nav_visit_github">
        <span data-text="nav_visit_github">{{t:nav_visit_github}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      </button>
    </div>
    <button class="hamburger" id="hamburger" aria-label="{{t:aria_menu}}" data-aria="aria_menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ========== MOBILE MENU ========== -->
<div class="mobile-backdrop" id="mobileBackdrop"></div>
<div class="mobile-menu" id="mobileMenu" role="menu" aria-hidden="true">
  <div class="mobile-menu-header" style="--i:0">
    <div class="mobile-menu-logo">
      <svg viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="42" height="42" rx="5" fill="#0b1b2a"/>
        <path d="M11 25h20M11 19h14M11 13h8" stroke="#9fc5d0" stroke-width="3" stroke-linecap="square" fill="none"/>
      </svg>
    </div>
    <div class="mobile-menu-brand-text">
      <span class="mobile-menu-brand-name" data-text="brand">{{t:brand}}</span>
      <span class="mobile-menu-brand-sub" data-text="brand_sub">{{t:brand_sub}}</span>
    </div>
  </div>
  <a style="--i:1" data-nav="home" role="menuitem"><span data-text="nav_home">{{t:nav_home}}</span>
    <svg class="m-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>
  <a style="--i:2" data-nav="features" role="menuitem"><span data-text="nav_features">{{t:nav_features}}</span>
    <svg class="m-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>
  <a style="--i:3" data-nav="about" role="menuitem"><span data-text="nav_about">{{t:nav_about}}</span>
    <svg class="m-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>
  <a style="--i:4" data-nav="download" role="menuitem"><span data-text="nav_download">{{t:nav_download}}</span>
    <svg class="m-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>
  <a style="--i:5" data-nav="faq" role="menuitem"><span data-text="nav_faq">{{t:nav_faq}}</span>
    <svg class="m-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>
  <a class="mobile-tg-btn" style="--i:5" id="mobileTelegramBtn" role="menuitem" href="{{TELEGRAM_URL}}" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M21.94 4.6 18.6 20.3c-.25 1.12-.91 1.4-1.85.87l-5.1-3.76-2.46 2.37c-.27.27-.5.5-1.02.5l.36-5.2 9.45-8.54c.41-.36-.09-.57-.64-.2L5.66 13.1.62 11.5c-1.1-.34-1.11-1.1.23-1.63L20.54 2.4c.91-.33 1.71.21 1.4 2.2z"/>
    </svg>
    <span data-text="nav_telegram_channel">{{t:nav_telegram_channel}}</span>
  </a>
  <a class="mobile-gh-btn" style="--i:6" id="mobileGithubBtn" role="menuitem"><span data-text="nav_visit_github">{{t:nav_visit_github}}</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
  </a>
  <nav class="mobile-lang" aria-label="{{t:aria_language}}" data-aria="aria_language">{{LANG_MOBILE}}</nav>
</div>
